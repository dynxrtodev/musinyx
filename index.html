<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Musinyx</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="viewAuth" class="auth-overlay" style="display: none;">
        <h2>Loading Musinyx...</h2>
    </div>

    <div class="app-container">
        <div class="greeting" id="greetingContainer">
            <span class="highlight">Wassup,</span><br>
            <span class="name">Music Lover</span>
        </div>
        <div class="search-box" id="searchContainer">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Songs, albums, or artists" onkeypress="handleEnter(event)" oninput="handleSearchInput()">
        </div>
        <div id="statusText"></div>

        <!-- VIEW HOME -->
        <div id="viewHome">
            <h3 class="section-title">Recently Played</h3>
            <div id="lastPlayedContainer" class="horizontal-scroll-container"></div>
            
            <div id="homeSectionsContainer"></div>
        </div>

        <!-- VIEW SEARCH -->
        <div id="viewSearch" style="display: none;">
            <h3 class="section-title">Search Results</h3>
            <div id="resultsContainer" class="list-container"></div>
        </div>

        <!-- VIEW PLAYLISTS -->
        <div id="viewPlaylists" style="display: none;">
            <h3 class="section-title">Your Playlists</h3>
            <div class="empty-state">Playlist feature coming soon!</div>
        </div>

        <!-- VIEW FAVORITES -->
        <div id="viewFavorites" style="display: none;">
            <h3 class="section-title">Liked Songs</h3>
            <div id="favoritesContainer" class="list-container"></div>
        </div>
    </div>

    <!-- MINI PLAYER -->
    <div id="playerContainer" onclick="openNowPlaying()">
        <img id="nowPlayingImg" src="https://via.placeholder.com/50" alt="Cover">
        <div class="player-info">
            <div id="nowPlayingTitle" class="title">No song playing</div>
            <div id="nowPlayingArtist" class="artist">-</div>
        </div>
        <div class="player-controls" onclick="event.stopPropagation()">
            <i class="fas fa-play" id="playPauseBtn" onclick="togglePlay()"></i>
            <i class="fas fa-step-forward" id="nextBtn" onclick="playNext()"></i>
        </div>
        <div class="progress-bar-container"><div class="progress-bar" id="playerProgress"></div></div>
        <audio id="audioPlayer"></audio>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <div class="nav-item active" id="navHome" onclick="switchView('home')"><i class="fas fa-home"></i><span>Home</span></div>
        <div class="nav-item" id="navFavorites" onclick="switchView('favorites')"><i class="fas fa-heart"></i><span>Favorites</span></div>
        <div class="nav-item" id="navPlaylist" onclick="switchView('playlists')"><i class="fas fa-music"></i><span>Playlists</span></div>
    </div>

    <!-- FULLSCREEN PLAYER -->
    <div id="viewNowPlaying" class="now-playing-fullscreen hidden">
        <div class="np-main-view">
            <div class="np-top-bar"><i class="fas fa-chevron-down" onclick="closeNowPlaying()"></i></div>
            <div class="np-cover-container"><img id="npCover" src="https://via.placeholder.com/300" alt="Cover"></div>
            <div class="np-info-container">
                <div class="np-text"><h2 id="npTitle">Title</h2><p id="npArtist">Artist</p></div>
            </div>
            <div class="np-progress-container">
                <input type="range" id="npSeekbar" value="0" min="0" max="100" step="0.1">
                <div class="np-time-info"><span id="npCurrentTime">00:00</span><span id="npTotalTime">00:00</span></div>
            </div>
            <div class="np-controls">
                <i class="fas fa-step-backward np-main-btn" onclick="playNext(true)"></i>
                <div class="np-play-circle" onclick="togglePlay()"><i class="fas fa-play" id="npPlayPauseBtn"></i></div>
                <i class="fas fa-step-forward np-main-btn" onclick="playNext()"></i>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
